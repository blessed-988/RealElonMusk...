<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ИЛОН МАСК</title>
  <style>
    :root{
      --bg-light-1: #f8f7f2;
      --bg-light-2: #e7e5dc;
      --bg-dark-2: #050406;
      --text-dark: #101010;
      --blood: #ff2b2b;
      --title-size: clamp(52px, 8vw, 96px);
      --step: 0.92em;
      --space: 0.58em;
    }

    * { box-sizing: border-box; }

    html {
      -webkit-text-size-adjust: 100%;
      touch-action: manipulation;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      background:
        radial-gradient(circle at 50% 30%, var(--bg-light-1) 0%, var(--bg-light-2) 62%, #d4d1c7 100%);
      transition: background 2.4s ease;
      color: var(--text-dark);
    }

    body.active {
      background:
        radial-gradient(circle at 50% 30%, rgba(95,0,12,0.28) 0%, rgba(28,8,15,0.18) 18%, rgba(8,6,8,0.95) 65%, var(--bg-dark-2) 100%);
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: -20%;
      pointer-events: none;
      z-index: 0;
    }

    body::before {
      background:
        radial-gradient(circle at 10% 20%, rgba(255,255,255,0.20) 0 1px, transparent 1px),
        radial-gradient(circle at 70% 30%, rgba(255,255,255,0.14) 0 1px, transparent 1px),
        radial-gradient(circle at 30% 80%, rgba(255,255,255,0.18) 0 1px, transparent 1px),
        radial-gradient(circle at 85% 75%, rgba(255,255,255,0.12) 0 1px, transparent 1px);
      background-size: 180px 180px, 240px 240px, 160px 160px, 210px 210px;
      opacity: 0.22;
      mix-blend-mode: multiply;
      filter: blur(0.4px);
      animation: drift 20s linear infinite;
    }

    body.active::before {
      opacity: 0.65;
      mix-blend-mode: screen;
      filter: blur(0.8px) contrast(115%);
    }

    body::after {
      background:
        radial-gradient(circle at center, transparent 0 46%, rgba(0,0,0,0.15) 68%, rgba(0,0,0,0.35) 100%);
      opacity: 0.55;
    }

    body.active::after {
      opacity: 0.95;
      background:
        radial-gradient(circle at center, transparent 0 34%, rgba(0,0,0,0.28) 58%, rgba(0,0,0,0.78) 100%);
    }

    .scene {
      position: relative;
      z-index: 2;
      width: min(92vw, 980px);
      height: min(70vh, 520px);
      display: grid;
      place-items: center;
      isolation: isolate;
    }

    .title-wrap {
      position: relative;
      padding: 3rem 4rem 4.2rem;
      border-radius: 28px;
    }

    .title-wrap::before {
      content: "";
      position: absolute;
      inset: -60px;
      border-radius: inherit;
      background:
        radial-gradient(circle at 50% 55%, rgba(255,255,255,0.55), rgba(255,255,255,0.0) 55%);
      opacity: 0.28;
      filter: blur(24px);
      transition: opacity 2s ease, background 2s ease;
      z-index: -1;
    }

    body.active .title-wrap::before {
      opacity: 0.14;
      background:
        radial-gradient(circle at 50% 55%, rgba(255, 0, 0, 0.28), rgba(255,0,0,0.0) 60%);
    }

    .title {
      position: relative;
      width: var(--title-width);
      height: 1.2em;
      font-size: var(--title-size);
      font-weight: 900;
      line-height: 1;
      user-select: none;
      cursor: default;
      text-transform: uppercase;
      letter-spacing: 0.02em;
      filter: drop-shadow(0 1px 0 rgba(255,255,255,0.55));
    }

    .char {
      position: absolute;
      top: 0;
      left: 0;
      transform: translateX(calc(var(--x) * 1em));
      transition:
        transform 2.8s cubic-bezier(0.16, 1, 0.2, 1),
        filter 1s ease;
      will-change: transform;
    }

    .char-inner {
      display: inline-block;
      color: var(--text-dark);
      transition:
        color 0.7s ease,
        text-shadow 0.7s ease,
        filter 0.7s ease;
    }

    body.active .char-inner {
      color: var(--blood);
      text-shadow:
        0 0 8px rgba(255, 45, 45, 0.75),
        0 0 22px rgba(255, 0, 0, 0.45),
        0 0 40px rgba(160, 0, 0, 0.22);
      filter: saturate(150%) contrast(120%);
      animation: tremble var(--shake, 0.12s) infinite steps(2, end);
    }

    body.active .title {
      filter: drop-shadow(0 0 18px rgba(255, 0, 0, 0.16));
    }

    .bottom {
      position: absolute;
      left: 50%;
      bottom: 12%;
      transform: translateX(-50%);
      text-align: center;
      width: min(90vw, 900px);
      font-size: clamp(16px, 2vw, 24px);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(40, 40, 40, 0.72);
      transition: color 1s ease, text-shadow 1s ease, transform 1s ease, opacity 1s ease;
      user-select: none;
      line-height: 1.55;
    }

    body.active .bottom {
      color: rgba(255, 120, 120, 0.9);
      text-shadow:
        0 0 8px rgba(255, 0, 0, 0.25),
        0 0 18px rgba(255, 0, 0, 0.15);
      transform: translateX(-50%) translateY(2px);
      opacity: 1;
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      mix-blend-mode: screen;
      opacity: 0;
      transition: opacity 1.2s ease, transform 1.2s ease, background 1.2s ease;
      filter: blur(1px);
    }

    .orb.one {
      width: 180px;
      height: 180px;
      left: 10%;
      top: 18%;
      background: radial-gradient(circle, rgba(255,255,255,0.35), rgba(255,255,255,0) 70%);
    }

    .orb.two {
      width: 220px;
      height: 220px;
      right: 12%;
      top: 22%;
      background: radial-gradient(circle, rgba(255,255,255,0.24), rgba(255,255,255,0) 72%);
    }

    body.active .orb {
      opacity: 1;
    }

    body.active .orb.one {
      background: radial-gradient(circle, rgba(255,0,0,0.14), rgba(255,0,0,0) 70%);
      transform: translate(10px, -8px) scale(1.1);
      animation: floatA 5s ease-in-out infinite;
    }

    body.active .orb.two {
      background: radial-gradient(circle, rgba(255,0,0,0.11), rgba(255,0,0,0) 72%);
      transform: translate(-12px, 10px) scale(1.05);
      animation: floatB 6.5s ease-in-out infinite;
    }

    @keyframes tremble {
      0%   { transform: translate(0, 0) rotate(0deg); }
      25%  { transform: translate(1px, -1px) rotate(-0.8deg); }
      50%  { transform: translate(-1px, 1px) rotate(1deg); }
      75%  { transform: translate(1px, 0px) rotate(-1deg); }
      100% { transform: translate(0, 0) rotate(0deg); }
    }

    @keyframes drift {
      from { transform: translate3d(0, 0, 0); }
      to { transform: translate3d(4%, -3%, 0); }
    }

    @keyframes floatA {
      0%, 100% { transform: translate(10px, -8px) scale(1.1); }
      50%      { transform: translate(24px, -18px) scale(1.2); }
    }

    @keyframes floatB {
      0%, 100% { transform: translate(-12px, 10px) scale(1.05); }
      50%      { transform: translate(-28px, 2px) scale(1.16); }
    }

    @media (max-width: 768px) {
      .scene {
        width: 96vw;
        height: auto;
        min-height: 60vh;
      }

      .title-wrap {
        padding: 1.5rem 1.2rem 2rem;
        border-radius: 18px;
      }

      .title-wrap::before {
        inset: -30px;
        filter: blur(14px);
      }

      .title {
        font-size: clamp(32px, 10vw, 56px);
      }

      .bottom {
        font-size: clamp(12px, 3.5vw, 16px);
        letter-spacing: 0.08em;
        width: 96vw;
        line-height: 1.5;
        word-break: break-word;
      }

      .orb.one {
        width: 100px;
        height: 100px;
        left: 5%;
        top: 10%;
      }

      .orb.two {
        width: 120px;
        height: 120px;
        right: 5%;
        top: 14%;
      }

      body.active .orb.one {
        transform: translate(6px, -5px) scale(1.1);
      }

      body.active .orb.two {
        transform: translate(-8px, 7px) scale(1.05);
      }
    }

    @media (max-width: 480px) {
      .scene {
        width: 98vw;
        min-height: 55vh;
      }

      .title-wrap {
        padding: 1rem 0.6rem 1.4rem;
        border-radius: 14px;
      }

      .title-wrap::before {
        inset: -18px;
        filter: blur(10px);
      }

      .title {
        font-size: clamp(24px, 8.5vw, 40px);
      }

      .bottom {
        font-size: clamp(10px, 3.2vw, 14px);
        letter-spacing: 0.05em;
        width: 98vw;
      }

      .orb.one {
        width: 70px;
        height: 70px;
        left: 2%;
        top: 6%;
      }

      .orb.two {
        width: 80px;
        height: 80px;
        right: 2%;
        top: 10%;
      }

      body.active .orb.one {
        transform: translate(4px, -3px) scale(1.1);
      }

      body.active .orb.two {
        transform: translate(-6px, 5px) scale(1.05);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation: none !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="scene">
    <div class="orb one"></div>
    <div class="orb two"></div>

    <div class="title-wrap" id="titleWrap" aria-label="ИЛОН МАСК">
      <div class="title" id="title"></div>
    </div>

    <div class="bottom" id="bottom">
      ПРЕДПРИНИМАТЕЛЬ, МИЛЛИАРДЕР
    </div>
  </div>

  <script>
    const source = "ИЛОН МАСК";
    const target = "ОН СКАМИЛ";

    const STEP = 0.92;
    const SPACE = 0.58;

    const title = document.getElementById("title");
    const wrap = document.getElementById("titleWrap");
    const bottom = document.getElementById("bottom");

    const bottomNormal = "ПРЕДПРИНИМАТЕЛЬ, МИЛЛИАРДЕР";
    const bottomActive = "УСТАНОВЛЕННОЕ КОЛИЧЕСТВО ЖЕРТВ: 1 240 917. СУММА\xA0УТРАТ\xA0НЕОБРАТИМА";

    function layout(str) {
      let x = 0;
      const arr = [];
      for (const ch of str) {
        if (ch === " ") {
          x += SPACE;
          continue;
        }
        arr.push({ ch, key: ch.toLowerCase(), x });
        x += STEP;
      }
      return { arr, width: x };
    }

    const src = layout(source);
    const dst = layout(target);

    title.style.setProperty("--title-width", `${src.width}em`);

    const positionsByKey = new Map();
    for (const item of dst.arr) {
      if (!positionsByKey.has(item.key)) positionsByKey.set(item.key, []);
      positionsByKey.get(item.key).push(item.x);
    }

    const letters = src.arr.map((item) => {
      const el = document.createElement("span");
      el.className = "char";
      el.style.setProperty("--x", item.x.toFixed(3));
      el.style.setProperty("--shake", `${(0.08 + Math.random() * 0.12).toFixed(2)}s`);

      const inner = document.createElement("span");
      inner.className = "char-inner";
      inner.textContent = item.ch;
      el.appendChild(inner);

      title.appendChild(el);

      const targetList = positionsByKey.get(item.key) || [];
      const toX = targetList.length ? targetList.shift() : item.x;

      return { el, fromX: item.x, toX };
    });

    let active = false;
    let timer = null;

    function setActive(state) {
      active = state;
      document.body.classList.toggle("active", active);
      bottom.textContent = active ? bottomActive : bottomNormal;

      clearTimeout(timer);
      timer = setTimeout(() => {
        letters.forEach((letter) => {
          letter.el.style.setProperty("--x", active ? letter.toX.toFixed(3) : letter.fromX.toFixed(3));
        });
      }, active ? 80 : 0);
    }

    wrap.addEventListener("mouseenter", () => setActive(true));
    wrap.addEventListener("mouseleave", () => setActive(false));

    let touchActive = false;

    wrap.addEventListener("touchstart", (e) => {
      e.preventDefault();
      touchActive = !touchActive;
      setActive(touchActive);
    }, { passive: false });

    wrap.addEventListener("touchend", () => {
      if (touchActive) {
        touchActive = false;
        setActive(false);
      }
    }, { passive: true });
  </script>
</body>
</html>
